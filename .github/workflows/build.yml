name: Build Player Only

on:
    push:
        branches:
            - '**'
    workflow_dispatch:

jobs:
    build-player:
        name: Build Player.dll
        runs-on: windows-latest

        steps:
            -   name: Get latest CMake and ninja
                uses: lukka/get-cmake@latest

            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    submodules: recursive

            -   name: Install Rust nightly toolchain
                uses: dtolnay/rust-toolchain@nightly
                with:
                    components: rust-src

            -   name: Setup VS environment
                uses: ilammy/msvc-dev-cmd@v1
                with:
                    arch: x64

            -   name: Configure release
                run: cmake --preset x64-Release .

            -   name: Build Player only
                run: cmake --build _build/x64-Release --target Player -j12

            -   name: Collect Player.dll
                shell: powershell
                run: |
                    $dll = Get-ChildItem -Path "_build/x64-Release" -Filter "Player.dll" -Recurse | Select-Object -First 1

                    if (-not $dll) {
                        throw "Player.dll was not produced."
                    }

                    New-Item -ItemType Directory -Force -Path "_player-artifact" | Out-Null

                    Copy-Item $dll.FullName "_player-artifact/Player.dll"

                    Write-Host "Found Player.dll at $($dll.FullName)"

            -   name: Upload Player.dll
                uses: actions/upload-artifact@v4
                with:
                    name: Player-Release
                    path: _player-artifact/Player.dll
